<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #02060f; }

  .sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(130% 90% at 50% 105%, #163d63 0%, #0c2347 32%, #06122e 62%, #02060f 100%);
  }

  /* ---- soft aurora masses (clean single hues, screen-blended) ---- */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    mix-blend-mode: screen;
    will-change: transform, opacity;
  }
  .g-green {
    left: -15vw; top: 5vh; width: 75vw; height: 80vh;
    background: radial-gradient(closest-side, rgba(40,255,170,0.95), rgba(20,210,140,0.4) 55%, transparent 78%);
    animation: drift-a 16s ease-in-out infinite alternate;
  }
  .g-cyan {
    left: 25vw; top: -5vh; width: 65vw; height: 90vh;
    background: radial-gradient(closest-side, rgba(70,225,255,0.9), rgba(40,160,255,0.4) 52%, transparent 76%);
    animation: drift-b 21s ease-in-out infinite alternate;
  }
  .g-violet {
    left: 45vw; top: -20vh; width: 60vw; height: 70vh;
    background: radial-gradient(closest-side, rgba(185,120,255,0.75), rgba(130,90,255,0.3) 50%, transparent 74%);
    animation: drift-c 18s ease-in-out infinite alternate;
  }
  @keyframes drift-a { 0% { transform: translate(0,0) scale(1); }       100% { transform: translate(7vw,4vh) scale(1.12); } }
  @keyframes drift-b { 0% { transform: translate(0,0) scale(1.05); }    100% { transform: translate(-9vw,5vh) scale(0.92); } }
  @keyframes drift-c { 0% { transform: translate(0,0) scale(0.95); }    100% { transform: translate(6vw,7vh) scale(1.15); } }

  /* ---- the curtain striations: thin vertical light columns ("folds") ---- */
  .rays {
    position: absolute; left: -20%; right: -20%; top: 0; bottom: 0;
    mix-blend-mode: screen;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
    will-change: transform, background-position;
  }
  .rays-1 {
    background: repeating-linear-gradient(90deg,
      transparent 0px, transparent 9px,
      rgba(80,255,190,0.6) 10px, rgba(120,255,210,0.85) 12px, rgba(80,255,190,0.6) 14px,
      transparent 15px, transparent 30px);
    filter: blur(9px);
    animation: shimmer-1 7s linear infinite, sway-r1 19s ease-in-out infinite alternate;
  }
  .rays-2 {
    background: repeating-linear-gradient(90deg,
      transparent 0px, transparent 16px,
      rgba(150,210,255,0.5) 18px, rgba(190,170,255,0.7) 21px, rgba(150,210,255,0.5) 24px,
      transparent 26px, transparent 52px);
    filter: blur(13px);
    opacity: 0.85;
    animation: shimmer-2 11s linear infinite, sway-r2 25s ease-in-out infinite alternate;
  }
  @keyframes shimmer-1 { from { background-position-x: 0; } to { background-position-x: 60px; } }
  @keyframes shimmer-2 { from { background-position-x: 0; } to { background-position-x: -104px; } }
  @keyframes sway-r1 { 0% { transform: skewX(-10deg) scaleY(1)   translateY(-2vh); } 100% { transform: skewX(7deg)  scaleY(1.08) translateY(2vh); } }
  @keyframes sway-r2 { 0% { transform: skewX(8deg)  scaleY(1.05) translateY(1vh);  } 100% { transform: skewX(-9deg) scaleY(0.95) translateY(-2vh); } }

  /* ---- bright pulsing core ribbon for punch ---- */
  .core {
    position: absolute; left: -10%; right: -10%; top: 28%; height: 22vh;
    background: linear-gradient(to bottom, transparent, rgba(120,255,210,0.55) 45%, rgba(80,255,180,0.7) 55%, transparent);
    filter: blur(22px);
    mix-blend-mode: screen;
    transform-origin: 50% 50%;
    animation: core-pulse 5.5s ease-in-out infinite, core-wave 14s ease-in-out infinite alternate;
  }
  @keyframes core-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes core-wave  { 0% { transform: skewX(-8deg) translateY(-1vh); } 100% { transform: skewX(9deg) translateY(2vh); } }

  /* ---- horizon afterglow ---- */
  .horizon {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34vh;
    background: linear-gradient(to top, rgba(40,255,180,0.28), rgba(40,200,255,0.1) 45%, transparent);
    mix-blend-mode: screen;
  }

  /* ---- stars ---- */
  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.2; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }

  /* ---- faint global shimmer (subtle, keeps it alive) ---- */
  .breath {
    position: absolute; inset: 0;
    background: radial-gradient(120% 70% at 50% 35%, rgba(120,255,210,0.06), transparent 70%);
    mix-blend-mode: screen;
    animation: breath 6s ease-in-out infinite;
  }
  @keyframes breath { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
</style>
</head>
<body>
    <div class="sky">
  <div class="glow g-green"></div>
  <div class="glow g-cyan"></div>
  <div class="glow g-violet"></div>
  <div class="rays rays-1"></div>
  <div class="rays rays-2"></div>
  <div class="core"></div>
  <div class="horizon"></div>
  <div class="breath"></div>
  <div class="stars" id="stars"></div>
</div>
<script>
const sw = document.getElementById('stars');
for (let i = 0; i < 140; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = 0.7 + Math.random() * 2.3;
  s.style.width = sz + 'px';
  s.style.height = sz + 'px';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = (Math.random() * 78) + '%';
  s.style.animationDelay = (Math.random() * 4) + 's';
  s.style.animationDuration = (2 + Math.random() * 3) + 's';
  if (sz > 2.3) s.style.boxShadow = '0 0 5px rgba(200,255,240,0.9)';
  sw.appendChild(s);
}
</script>
</body>
</html>
