<script>
      function setProfileImg(imgElement, firebaseUrl) {
  const SPINNER = "./imgs/Spinner.svg"; // путь к спиннеру
  const DEFAULT = "https://lab.marsit.uz/media/avatar/defaults/av-code.png";

  // Сначала ставим спиннер
  imgElement.src = SPINNER;

  // Имитация получения данных с Firebase (например, get)
  getUserProfileImgFromFirebase().then(url => {
    if (url) {
      // Если картинка есть в Firebase
      imgElement.src = url;
    } else {
      // Если картинки нет
      imgElement.src = DEFAULT;
    }
  }).catch(() => {
    // На случай ошибки тоже дефолт
    imgElement.src = DEFAULT;
  });
}

// Пример функции, которая возвращает Promise с URL из Firebase
function getUserProfileImgFromFirebase() {
  return new Promise((resolve, reject) => {
    const userProfileRef = dbRef(profiledb, `users-profileImage/${userId}`);
    onValue(userProfileRef, snapshot => {
      const data = snapshot.val();
      if (data?.image) resolve(data.image);        // Base64 или URL
      else if (data?.photoURL) resolve(data.photoURL); // Avatar URL
      else resolve(null);
    }, err => reject(err));
  });
}

// Используем на всех img
document.querySelectorAll(".user-img").forEach(img => {
  setProfileImg(img);
});

    </script>

const userId = "TEST_STATIC_PROFILE_ID";
const userProfileRef = dbRef(profiledb, `users-profile/${userId}`);

// 🔥 Обновляем все .user-img на странице
onValue(userProfileRef, (snap) => {

    const finalImg = data?.image || data?.photoURL;

    document.querySelectorAll('.user-img').forEach(img => {
        img.src = finalImg;
    });
});
