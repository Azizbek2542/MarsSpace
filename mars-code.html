        <script>
      function setProfileImg(imgElement, firebaseUrl) {
  const SPINNER = "./imgs/Spinner.svg"; // путь к спиннеру
  const DEFAULT = "https://lab.marsit.uz/media/avatar/defaults/av-code.png";

  // Сначала ставим спиннер
  imgElement.src = SPINNER;

  // Имитация получения данных с Firebase (например, get)
  getUserProfileImgFromFirebase().then(url => {
    if (url) {
      // Если картинка есть в Firebase
      imgElement.src = url;
    } else {
      // Если картинки нет
      imgElement.src = DEFAULT;
    }
  }).catch(() => {
    // На случай ошибки тоже дефолт
    imgElement.src = DEFAULT;
  });
}

// Пример функции, которая возвращает Promise с URL из Firebase
function getUserProfileImgFromFirebase() {
  return new Promise((resolve, reject) => {
    const userProfileRef = dbRef(profiledb, `users-profileImage/${userId}`);
    onValue(userProfileRef, snapshot => {
      const data = snapshot.val();
      if (data?.image) resolve(data.image);        // Base64 или URL
      else if (data?.photoURL) resolve(data.photoURL); // Avatar URL
      else resolve(null);
    }, err => reject(err));
  });
}

// Используем на всех img
document.querySelectorAll(".user-img").forEach(img => {
  setProfileImg(img);
});

    </script>

    messagingSenderId: "198640947214",
    appId: "1:198640947214:web:e2b13d6b3a4302e8a0d8a0"
};

const app2 = initializeApp(firebaseConfig2);
const profiledb = getDatabase(app2);

const userId = "TEST_STATIC_PROFILE_ID";
const userProfileRef = dbRef(profiledb, `users-profile/${userId}`);

// 🔥 Обновляем все .user-img на странице
onValue(userProfileRef, (snap) => {
    const data = snap.val();
    const finalImg = data?.image || data?.photoURL;

    if (!finalImg) return;

    document.querySelectorAll('.user-img').forEach(img => {
        img.src = finalImg;
    });
});
</script>

    <script>
    function Sidebarcolor() {
  const observer = new MutationObserver(() => {
    const sidebarLink = document.querySelector('.sidebar-link.MarsCode');
    if (sidebarLink) {
      sidebarLink.style.background = '#fc6736';
      sidebarLink.style.color = '#fff';
      observer.disconnect(); // прекращаем слежку
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });
}

Sidebarcolor();
    </script>

    
<script>
  function waitForNavbar() {
  const navbar = document.querySelector('.navbar');
  if (navbar) {
    const codeEditor = document.querySelector('.code-editor');
    codeEditor.style.paddingTop = navbar.offsetHeight + 'px';
  } else {
    // пробуем снова через 100мс
    setTimeout(waitForNavbar, 100);
  }
}

document.addEventListener('DOMContentLoaded', waitForNavbar);
</script>
