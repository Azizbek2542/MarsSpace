      function setProfileImg(imgElement, firebaseUrl) {
  const SPINNER = "./imgs/Spinner.svg"; // путь к спиннеру
  const DEFAULT = "https://lab.marsit.uz/media/avatar/defaults/av-code.png";

  // Сначала ставим спиннер
  imgElement.src = SPINNER;

  // Имитация получения данных с Firebase (например, get)
  getUserProfileImgFromFirebase().then(url => {
    if (url) {
      // Если картинка есть в Firebase
      imgElement.src = url;
    } else {
      // Если картинки нет
      imgElement.src = DEFAULT;
    }
  }).catch(() => {
    // На случай ошибки тоже дефолт
    imgElement.src = DEFAULT;
  });
}

// Пример функции, которая возвращает Promise с URL из Firebase
function getUserProfileImgFromFirebase() {
  return new Promise((resolve, reject) => {
    const userProfileRef = dbRef(profiledb, `users-profileImage/${userId}`);
    onValue(userProfileRef, snapshot => {
      const data = snapshot.val();
      if (data?.image) resolve(data.image);        // Base64 или URL
      else if (data?.photoURL) resolve(data.photoURL); // Avatar URL
      else resolve(null);
    }, err => reject(err));
  });
}

// Используем на всех img
document.querySelectorAll(".user-img").forEach(img => {
  setProfileImg(img);
});

function loadPurchaseHistory() {
    const historyRef = dbRef(profiledb, "SpacePurchaseHistory");

    showSkeleton(); // ← показываем скелетоны сразу

    onValue(historyRef, (snap) => {
        const purchases = snap.val();
        const historyContainer = document.getElementById("historyContainer");

        if (!purchases) {
            showEmptyMessage();
            return;
        }

        historyContainer.innerHTML = ""; // убираем скелетоны

        for (const key in purchases) {
            const item = purchases[key];
            const date = new Date(item.time);
            const formattedDate = `${date.getDate()} ${date.toLocaleString('en-US', { month: 'short' })} ${date.getFullYear()} | ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;

            let statusText = "";
            let statusClass = "";

            if (item.status === "pending") {
                statusText = "Tovar kutilmoqda";
                statusClass = "status-pending";
            }
            else if (item.status === "accepted") {
                statusText = "Qabul qilindi";
                statusClass = "status-accepted";
            }
            else if (item.status === "rejected") {
                statusText = "Bekor qilindi";
                statusClass = "status-rejected";
            }

            const html = `
            <div class="history-item">
                <div class="product-card__image-wrapper">
                    <img class="product-card__images" src="${item.imgUrl}" alt="product" loading="lazy">
                </div>
                <div style="padding: 0 16px;">
                    <span class="product-name line-clamp-1">${item.productName}</span>
                    <p class="product_quantity" style="color:rgb(179 192 218); font-size: 17px;">${formattedDate}</p>
                    <p class="product-status ${statusClass}">${statusText}</p>
                </div>
            </div>
            `;

            historyContainer.insertAdjacentHTML("beforeend", html);
        }
        const defaultItems = `
            <div class="history-item">
              <div class="product-card__image-wrapper">
                  <img class="product-card__images" src="https://lab.marsit.uz/media/hero_details/3/ItemDefaultPants.png" alt="product" loading="lazy">

              </div>

                  <p class="product_quantity" style="color:rgb(179 192 218); font-size: 17px;">14 Jul 2025 | 13:01</p>

<script>
function waitForNavbar() {
  const navbar = document.querySelector('.navbar');
  const shopHistoryCont = document.querySelector('.shop-history');
  if (navbar) {
    if (window.innerWidth < 768) {
      shopHistoryCont.style.paddingTop = navbar.offsetHeight + 'px';
      shopHistoryCont.style.paddingBottom = navbar.offsetHeight + 'px';
    } else {
      shopHistoryCont.style.paddingTop = navbar.offsetHeight + 'px';
    }
  } else {
    // пробуем снова через 100мс
    setTimeout(waitForNavbar, 100);
  }
}

document.addEventListener('DOMContentLoaded', waitForNavbar);
window.addEventListener('resize', waitForNavbar);
</script>
