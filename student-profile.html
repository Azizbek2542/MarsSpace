      function setProfileImg(imgElement, firebaseUrl) {
  const SPINNER = "./imgs/Spinner.svg"; // путь к спиннеру
  const DEFAULT = "https://lab.marsit.uz/media/avatar/defaults/av-code.png";

  // Сначала ставим спиннер
  imgElement.src = SPINNER;

  // Имитация получения данных с Firebase (например, get)
  getUserProfileImgFromFirebase().then(url => {
    if (url) {
      // Если картинка есть в Firebase
      imgElement.src = url;
    } else {
      // Если картинки нет
      imgElement.src = DEFAULT;
    }
  }).catch(() => {
    // На случай ошибки тоже дефолт
    imgElement.src = DEFAULT;
  });
}

// Пример функции, которая возвращает Promise с URL из Firebase
function getUserProfileImgFromFirebase() {
  return new Promise((resolve, reject) => {
    const userProfileRef = dbRef(profiledb, `users-profileImage/${userId}`);
    onValue(userProfileRef, snapshot => {
      const data = snapshot.val();
      if (data?.image) resolve(data.image);        // Base64 или URL
      else if (data?.photoURL) resolve(data.photoURL); // Avatar URL
      else resolve(null);
    }, err => reject(err));
  });
}

// Используем на всех img
document.querySelectorAll(".user-img").forEach(img => {
  setProfileImg(img);
});

      '>': '&gt;',
      '"': '&quot;',

    })[s];
  });

// 🕓 Функция "сколько прошло времени"
function timeAgo(timestamp) {
  const now = Date.now();
  const diffMs = now - timestamp;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHr = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHr / 24);

  function plural(n, one, few, many) {
    const n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return one;
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
    return many;
  }

  if (diffDay > 0) {
    return `${diffDay} ${plural(diffDay, 'день', 'дня', 'дней')} назад`;
  } else if (diffHr > 0) {
    return `${diffHr} ${plural(diffHr, 'час', 'часа', 'часов')} назад`;
  } else if (diffMin > 0) {
    return `${diffMin} ${plural(diffMin, 'минута', 'минуты', 'минут')} назад`;
  } else {
    return 'только что';
  }
}

function formatDateTime(timestamp) {
  const date = new Date(timestamp);
  const year = date.getFullYear();
  const months = [
    "Yan", "Fev", "Mar", "Apr", "May", "Iyun",
    "Iyul", "Avg", "Sen", "Okt", "Noy", "Dek"
  ];
  const month = months[date.getMonth()];
  const day = String(date.getDate()).padStart(2, "0");
  const hours = String(date.getHours()).padStart(2, "0");
  const minutes = String(date.getMinutes()).padStart(2, "0");

  return `${year}-${month}-${day}, ${hours}:${minutes}`;
}

// Periodically update "time ago" text for posts and comments
function refreshTimeAgoElements() {
  const els = document.querySelectorAll('.time-ago');
  els.forEach(el => {
    const ts = Number(el.getAttribute('data-ts'));
    if (!ts) return;
    el.textContent = timeAgo(ts);
  });
}

// Refresh every 30 seconds
setInterval(refreshTimeAgoElements, 30 * 1000);
// Also refresh once on load (in case elements existed already)
document.addEventListener('DOMContentLoaded', refreshTimeAgoElements);

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const textarea = document.getElementById('msgInput');
    const counter = document.querySelector('.input__count');
    const maxLength = textarea.getAttribute('maxlength');

    // Функция обновления счетчика
    function updateCount() {
        const currentLength = textarea.value.length;
        counter.textContent = `${currentLength} / ${maxLength}`;
    }

    // Инициализация при загрузке
    updateCount(); 

    // Обновление при вводе
    textarea.addEventListener('input', updateCount);
});
</script>
