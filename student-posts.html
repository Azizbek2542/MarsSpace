// Получает список лайкнутых постов из памяти браузера
function getLikedPosts() {
    const likes = localStorage.getItem('myLikedPosts');
    return likes ? JSON.parse(likes) : {};
}

// Сохраняет лайк (true) или дизлайк (false) в память
function setLikedPost(postId, isLiked) {
    const likes = getLikedPosts();
    if (isLiked) {
        likes[postId] = true;
    } else {
        delete likes[postId];
    }
    localStorage.setItem('myLikedPosts', JSON.stringify(likes));
}
// --- (End Helpers) ---

// Simple HTML-escape helper to avoid injecting raw HTML from comments
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (s) => {
    return ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[s];
  });
}

`;

    // 1. Получаем точный элемент, на который нажали
    const target = e.target; 

    // 2. Проверяем, что:
    //    - Нажали именно на тег <I> (target.tagName === 'I')
    //    - Этот <I> находится внутри кнопки с классом .like-btn
    const likeBtn = target.closest('.like-btn');
    
    // 🔥 ГЛАВНОЕ ИЗМЕНЕНИЕ ТУТ:
    if (target.tagName === 'I' && likeBtn) {
        // (Мы уверены, что нажали на иконку внутри кнопки лайка)
        
        const postId = likeBtn.dataset.postid;
        if (!postId) return;

        const postRef = ref(db, `posts/${postId}`);
        
        // ВАЖНО: likeIcon - это 'target', так как мы уже знаем,
        // что target - это и есть иконка <i>
        const likeIcon = target; 
        
        // А вот 'span' нужно найти относительно 'likeBtn'
        const likeSpan = likeBtn.querySelector('span');
        const currentLikes = parseInt(likeSpan.textContent, 10);

    //     if(currentLikes === 0 ) {
    //   const LikesModalBody = document.querySelector('.likes-mdl-body');
    //   LikesModalBody.textContent = `
    //   hello`;
    // }else if(currentLikes > 0 ) {
    //   const LikesModalBody = document.querySelector('.likes-mdl-body');
    //   LikesModalBody.textContent = `Hozircha like bosgan foydalanuvchilar yo'q.`;
    // }

        // Проверяем, был ли пост уже лайкнут (по данным из localStorage)
        const isLiked = getLikedPosts()[postId] === true;

        if (isLiked) {
            // --- ЛАЙК УЖЕ СТОИТ (Отменяем) ---
            await update(postRef, { likes: increment(-1) }); 
            setLikedPost(postId, false); 

            // Обновляем UI
            likeSpan.textContent = currentLikes - 1;
            likeIcon.classList.remove('fa-solid');
            likeIcon.classList.add('fa-regular');
            likeBtn.classList.remove('liked');
            
        } else {
            // --- ЛАЙКА НЕТ (Ставим) ---
            await update(postRef, { likes: increment(1) });
            setLikedPost(postId, true);

            // Обновляем UI
            likeSpan.textContent = currentLikes + 1;
            likeIcon.classList.remove('fa-regular');
            likeIcon.classList.add('fa-solid');
            likeBtn.classList.add('liked');
        }
    }

    // Delegated handler: send comment button
    const sendBtn = target.closest('button.sendCommentBtn');
    if (sendBtn) {
      // Find the post container and its input
      const postItem = sendBtn.closest('.post-item');
      const commentInputEl = postItem?.querySelector('.commentInput');
      const postIdEl = postItem?.querySelector('.like-btn');
      const postIdForChat = postIdEl?.dataset.postid;
      const commentCountSpan = postItem?.querySelector('.comment-btn span');

      if (!commentInputEl) return; // nothing to do

      const postChatText = commentInputEl.value.trim();
      if (!postChatText) return; // don't send empty

      // push comment under postsChat/<postId>
      const postChatsRefForPost = ref(db, `postsChat/${postIdForChat}`);
      await push(postChatsRefForPost, {
        user: username,
        text: postChatText,
        timestamp: Date.now()
      });

      // Increment commentCount in posts/<postId>
      const postRef = ref(db, `posts/${postIdForChat}`);
      await update(postRef, { commentCount: increment(1) });

      // Update UI: increment the visible counter
      if (commentCountSpan) {
        const currentCount = parseInt(commentCountSpan.textContent, 10) || 0;
        commentCountSpan.textContent = currentCount + 1;
      }

      // clear input and update counter
      commentInputEl.value = '';
      commentInputEl.dispatchEvent(new Event('input'));

      return; // handled
    }

    // (Если у вас будет код для других комментов, он будет здесь)
    // const commentBtn = e.target.closest('.comment-btn');
    // if (target.tagName === 'I' && commentBtn) { ... }
});

      if (commentInput.value.trim().length > 0) {

        sendCommentBtn.style.cursor = 'not-allowed';

        await update(postRef, { commentCount: increment(1) });

        // Update UI: increment the visible counter
        const postItem = document.querySelector(`.post-item [data-postid="${currentCommentPostId}"]`)?.closest('.post-item');
        if (postItem) {
          const commentCountSpan = postItem.querySelector('.comment-btn span');
          if (commentCountSpan) {
            const currentCount = parseInt(commentCountSpan.textContent, 10) || 0;
            commentCountSpan.textContent = currentCount + 1;
          }
        }

        // clear input and update counter
        commentInput.value = '';
        commentInput.dispatchEvent(new Event('input'));
      }
    });

    const LikesCount = actionsDiv.querySelector('.like-btn span');
    const LikesModal = document.querySelector('.likes-modal');
    const CloseLikesModalBtn = document.querySelector('.close-like-mdl-btn');
    
    LikesCount.addEventListener('click', () => {
      LikesModal.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    overlay.addEventListener('click', () => {
      LikesModal.classList.remove('active');
      commentsModal.classList.remove('active');
    });

    CloseLikesModalBtn.addEventListener('click', () => {
      LikesModal.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = 'auto';
    });
    
    div.appendChild(actionsDiv);
    
    // Добавляем пост в контейнер (не затираем старые)
    chatContainer.prepend(div);

    // Скроллим вниз
    chatContainer.scrollTop = chatContainer.scrollHeight;
  })();
});

// 🕓 Функция "сколько прошло времени"
function timeAgo(timestamp) {
  const now = Date.now();
  const diffMs = now - timestamp;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHr = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHr / 24);

  function plural(n, one, few, many) {
    const n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return one;
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
    return many;
  }

  if (diffDay > 0) {
    return `${diffDay} ${plural(diffDay, 'день', 'дня', 'дней')} назад`;
  } else if (diffHr > 0) {
    return `${diffHr} ${plural(diffHr, 'час', 'часа', 'часов')} назад`;
  } else if (diffMin > 0) {
    return `${diffMin} ${plural(diffMin, 'минута', 'минуты', 'минут')} назад`;
  } else {
    return 'только что';
  }
}

function formatDateTime(timestamp) {
  const date = new Date(timestamp);
  const year = date.getFullYear();
  const months = [
    "Yan", "Fev", "Mar", "Apr", "May", "Iyun",
    "Iyul", "Avg", "Sen", "Okt", "Noy", "Dek"
  ];
  const month = months[date.getMonth()];
  const day = String(date.getDate()).padStart(2, "0");
  const hours = String(date.getHours()).padStart(2, "0");
  const minutes = String(date.getMinutes()).padStart(2, "0");

  return `${year}-${month}-${day}, ${hours}:${minutes}`;
}

// Periodically update "time ago" text for posts and comments
function refreshTimeAgoElements() {
  const els = document.querySelectorAll('.time-ago');
  els.forEach(el => {
    const ts = Number(el.getAttribute('data-ts'));
    if (!ts) return;
    el.textContent = timeAgo(ts);
  });
}

// Refresh every 30 seconds
setInterval(refreshTimeAgoElements, 30 * 1000);
// Also refresh once on load (in case elements existed already)
document.addEventListener('DOMContentLoaded', refreshTimeAgoElements);
