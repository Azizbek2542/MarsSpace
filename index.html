  <script>
const botToken = "8545358962:AAHx3Ls2aFDDG2qraqTtPJoAn8hzFZYi_2U";
let generatedCode = null;

function sendCodeToTelegram() {
  const tgId = document.getElementById("tg-id").value.trim();
  const status = document.getElementById("status");

  if (!tgId) {
    status.textContent = "⚠️ Telegram ID kiriting!";
    status.style.color = "red";
    return;
  }

  // 6-значный код
  generatedCode = Math.floor(100000 + Math.random() * 900000);

  fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: tgId,
      text: `🔑 Tasdiqlash kodi: ${generatedCode}`
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.ok) {
      status.textContent = "📨 Kod Telegram bo'tga yuborildi!";
      status.style.color = "green";
    } else {
      status.textContent = "❌ Xatolik: Telegram ID noto'g'ri kiritilgan ";
      status.style.color = "red";
    }
  })
  .catch(() => {
    status.textContent = "❌ Internetda xatolik!";
    status.style.color = "red";
  });
}

function checkTelegramCode() {
  const otp = document.getElementById("otp").value.trim();
  const status = document.getElementById("status");

  if (!otp) {
    status.textContent = "⚠️ Kod kiriting!";
    status.style.color = "red";
    return;
  }

  if (otp === String(generatedCode)) {
    status.textContent = "✅ Kirish muvaffaqiyatli!";
    status.style.color = "green";

    setTimeout(() => {
      window.location.href = "./main-page.html";
    }, 1000);

  } else {
    status.textContent = "❌ Kod noto‘g‘ri!";
    status.style.color = "red";
  }
}
</script>
